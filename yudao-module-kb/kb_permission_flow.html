<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-soft-strong: #E5EAFF;
  --brand-text: #1A1759;
  --brand-on: #FFFFFF;
  --chart-series-1: #3C2ECA;
  --chart-series-2: #A9AEFF;
  --chart-series-3: #6F6FFF;
  --chart-series-4: #22A5F7;
  --chart-other: #D3D4DA;
  --accent: #27D2BF;
  --accent-2: #F87454;
  --accent-soft: #EAFBF8;
  --accent-text: #0F766E;
  --success: #1DC981;
  --warning: #EFAA17;
  --danger: #E8463A;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-metric: "Inter", "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
:root[data-widget-theme="dark"] {
  color-scheme: dark;
  --surface: #171717;
  --surface-muted: #262626;
  --text: #E5E5E5;
  --text-muted: #A1A1AA;
  --border: rgba(229, 229, 229, 0.12);
  --brand: #6054F1;
  --brand-soft: #1A1759;
  --brand-soft-strong: #3C2ECA;
  --brand-text: #CFD8FF;
  --chart-series-1: #4B3FE3;
}
.t { fill: var(--text); font: var(--weight-regular) var(--text-body) var(--font-sans); }
.th { fill: var(--text); font: var(--weight-medium) var(--text-body) var(--font-sans); }
.ts { fill: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.tc { fill: var(--text-muted); font: var(--weight-medium) var(--text-code) var(--font-mono); }
.arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.arr-brand { stroke: var(--brand); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.arr-success { stroke: var(--success); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 6 3; }
.arr-danger { stroke: var(--danger); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-dasharray: 6 3; }
g.c-neutral > rect, rect.c-neutral { fill: var(--surface); stroke: var(--border); }
g.c-brand > rect, rect.c-brand { fill: var(--brand-soft); stroke: var(--brand); }
.c-brand > .th, .c-brand > .t { fill: var(--brand-text); }
.c-brand > .ts { fill: var(--brand); }
g.c-accent > rect, rect.c-accent { fill: var(--accent-soft); stroke: var(--accent); }
.c-accent > .th, .c-accent > .t { fill: var(--accent-text); }
.c-accent > .ts { fill: var(--accent); }
rect.c-success { fill: color-mix(in srgb, var(--success) 14%, transparent); stroke: var(--success); }
rect.c-danger { fill: color-mix(in srgb, var(--danger) 14%, transparent); stroke: var(--danger); }
rect.c-warning { fill: color-mix(in srgb, var(--warning) 14%, transparent); stroke: var(--warning); }
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" width="100%" height="auto">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--brand)"/>
    </marker>
    <marker id="arrs" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--success)"/>
    </marker>
    <marker id="arrd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--danger)"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="th" font-weight="600">知识库权限控制 — 三层模型</text>

  <!-- === Entry: User Request === -->
  <g class="c-brand">
    <rect x="260" y="50" width="200" height="50" rx="25"/>
    <text x="360" y="80" text-anchor="middle" class="th">用户请求</text>
  </g>
  <path d="M 360 100 L 360 130" class="arr-brand" marker-end="url(#arrb)"/>

  <!-- === Admin Bypass === -->
  <g class="c-accent">
    <rect x="500" y="85" width="180" height="30" rx="6"/>
    <text x="590" y="104" text-anchor="middle" class="ts">超管/租户管理员 → 跳过所有过滤</text>
  </g>
  <path d="M 460 75 L 500 100" class="arr" stroke="var(--accent)" marker-end="url(#arr)"/>

  <!-- === Layer 1: Category Visibility === -->
  <rect x="40" y="135" width="640" height="150" rx="10" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="360" y="155" text-anchor="middle" class="ts" font-weight="600">第 1 层 — 分类可见性</text>

  <g class="c-neutral">
    <rect x="260" y="170" width="200" height="45" rx="8"/>
    <text x="360" y="188" text-anchor="middle" class="th">listCategoriesForUser()</text>
    <text x="360" y="205" text-anchor="middle" class="ts">CategoryServiceImpl</text>
  </g>

  <text x="160" y="210" class="ts">获取用户所有部门</text>
  <path d="M 220 205 L 260 195" class="arr" marker-end="url(#arr)"/>

  <text x="160" y="230" class="ts">+ 祖先部门链</text>
  <path d="M 220 225 L 260 195" class="arr" marker-end="url(#arr)"/>

  <text x="160" y="250" class="ts">× deptScope 交集</text>
  <path d="M 220 245 L 260 195" class="arr" marker-end="url(#arr)"/>

  <text x="480" y="210" class="ts">→ 返回可见分类</text>
  <path d="M 460 195 L 500 205" class="arr" marker-end="url(#arr)"/>

  <path d="M 360 215 L 360 300" class="arr-brand" marker-end="url(#arrb)"/>

  <!-- === Layer 2: Library Visibility === -->
  <rect x="40" y="305" width="640" height="200" rx="10" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="360" y="325" text-anchor="middle" class="ts" font-weight="600">第 2 层 — 知识库列表可见性 + 管理权限</text>

  <g class="c-neutral">
    <rect x="100" y="340" width="180" height="45" rx="8"/>
    <text x="190" y="358" text-anchor="middle" class="th">filterVisible()</text>
    <text x="190" y="375" text-anchor="middle" class="ts">列表可见性</text>
  </g>

  <g class="c-neutral">
    <rect x="440" y="340" width="180" height="45" rx="8"/>
    <text x="530" y="358" text-anchor="middle" class="th">validateManagementPermission()</text>
    <text x="530" y="375" text-anchor="middle" class="ts">管理操作权限</text>
  </g>

  <text x="90" y="420" class="ts">visibilityRule:</text>
  <text x="90" y="438" class="tc">1=个人 2=院级</text>
  <text x="90" y="454" class="tc">3=公司 5=指定部门</text>

  <text x="300" y="420" class="ts">ownerId + 祖先部门</text>
  <text x="300" y="438" class="ts">isProject 特殊聚合</text>

  <text x="540" y="420" class="ts">create/update/delete</text>
  <text x="540" y="438" class="ts">togglePublic</text>
  <text x="540" y="454" class="ts">canManage</text>

  <path d="M 360 500 L 360 540" class="arr-brand" marker-end="url(#arrb)"/>

  <!-- === Layer 3: Content Access === -->
  <rect x="40" y="545" width="640" height="90" rx="10" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="360" y="565" text-anchor="middle" class="ts" font-weight="600">第 3 层 — 内容级访问控制</text>

  <g class="c-neutral">
    <rect x="260" y="580" width="200" height="40" rx="8"/>
    <text x="360" y="605" text-anchor="middle" class="th">kb_project_member 检查</text>
  </g>

  <text x="100" y="605" class="ts">isProject=1</text>
  <path d="M 190 600 L 260 600" class="arr" marker-end="url(#arr)"/>

  <text x="500" y="605" class="ts">→ 非成员仅看基本信息</text>
  <path d="M 460 600 L 490 600" class="arr" marker-end="url(#arr)"/>

  <!-- === Right side: Rule Details === -->
  <rect x="560" y="380" width="145" height="105" rx="6" fill="var(--surface-muted)" stroke="var(--border)"/>
  <text x="632" y="398" text-anchor="middle" class="ts" font-weight="600">各规则管理权限</text>
  <text x="570" y="416" class="tc">rule=1: 所有者本人</text>
  <text x="570" y="434" class="tc">rule=2: 部门管理员</text>
  <text x="570" y="452" class="tc">rule=3: 公司管理员</text>
  <text x="570" y="470" class="tc">rule=5: ownerDim决定</text>

  <!-- Bottom: Result -->
  <path d="M 360 635 L 360 670" class="arr-brand" marker-end="url(#arrb)"/>

  <g class="c-brand">
    <rect x="260" y="675" width="200" height="50" rx="25"/>
    <text x="360" y="705" text-anchor="middle" class="th">返回权限过滤结果</text>
  </g>
</svg>
